name: Nightly Release

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

jobs:
  setup:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    outputs:
      commits: ${{ steps.get_commits.outputs.commits }}
      date: ${{ steps.current-time.outputs.formattedTime }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git submodule update --init --recursive --remote
      - uses: josStorer/get-current-time@v2.0.1
        id: current-time
        with:
          format: YYYY-MM-DD
      - name: Get commits from the last 24 hours
        id: get_commits
        shell: bash
        run: |
          cd vapourkit
          echo "commits<<EOF" >> "$GITHUB_OUTPUT"
          git rev-list --no-merges HEAD --not "$(git rev-list -n1 --before='24 hours' --first-parent HEAD)" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: setup
    if: ${{ needs.setup.outputs.commits || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init --recursive --remote
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd vapourkit && npm install
      - name: Set nightly version
        shell: bash
        run: |
          cd vapourkit
          version=$(node -p "require('./package.json').version")
          npm version "${version}-nightly.${{ needs.setup.outputs.date }}" --no-git-tag-version
      - run: cd vapourkit && npm run build:all
      - name: Prepare Windows assets
        shell: bash
        run: |
          mkdir -p release-assets
          find vapourkit/release -maxdepth 1 -type f -iname '*.exe' ! -iname '*.blockmap' -exec cp {} "release-assets/Vapourkit-windows-nightly-${{ needs.setup.outputs.date }}.exe" \;
          find vapourkit/release -maxdepth 1 -type f -iname '*.7z' -exec cp {} "release-assets/Vapourkit-windows-nightly-${{ needs.setup.outputs.date }}.7z" \;
          test -n "$(find release-assets -maxdepth 1 -type f -name '*.exe' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-windows
          path: release-assets/*
          if-no-files-found: error

  build-linux:
    needs: setup
    if: ${{ needs.setup.outputs.commits || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init --recursive --remote
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd vapourkit && npm install
      - name: Set nightly version
        shell: bash
        run: |
          cd vapourkit
          version=$(node -p "require('./package.json').version")
          npm version "${version}-nightly.${{ needs.setup.outputs.date }}" --no-git-tag-version
      - run: cd vapourkit && npm run build:linux
      - name: Prepare AppImage asset
        shell: bash
        run: |
          appimage=$(find vapourkit/release -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          test -n "$appimage"
          mkdir -p release-assets
          cp "$appimage" "release-assets/Vapourkit-linux-nightly-${{ needs.setup.outputs.date }}.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-linux
          path: release-assets/*.AppImage
          if-no-files-found: error

  release:
    needs: [setup, build-windows, build-linux]
    if: ${{ needs.setup.outputs.commits || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git submodule update --init --recursive --remote
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Build release notes
        id: notes
        shell: bash
        run: |
          cd vapourkit
          {
            echo "Built on ${{ needs.setup.outputs.date }}"
            echo
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "This is a manually triggered build."
              echo
              echo "Recent commits:"
              git log -n 10 --no-merges --pretty=format:'[%h](https://github.com/Kim2091/vapourkit/commit/%H) - %s (%cr) <%an>'
            else
              echo "Commits from the last 24 hours:"
              git log --no-merges HEAD --not "$(git rev-list -n1 --before='24 hours' --first-parent HEAD)" --pretty=format:'[%h](https://github.com/Kim2091/vapourkit/commit/%H) - %s (%cr) <%an>'
            fi
          } > ../history.txt
          {
            delimiter="VAPOURKIT_RELEASE_BODY_${RANDOM}_${RANDOM}"
            echo "body<<${delimiter}"
            cat ../history.txt
            # git log with --pretty=format does not guarantee a trailing
            # newline. The delimiter must occupy a line by itself for GitHub
            # Actions to accept the multiline output.
            printf '\n%s\n' "${delimiter}"
          } >> "$GITHUB_OUTPUT"
      - uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file_glob: true
          file: release-assets/Vapourkit-*-nightly-*
          tag: nightly-${{ needs.setup.outputs.date }}
          overwrite: true
          body: ${{ steps.notes.outputs.body }}
          release_name: Nightly build from ${{ needs.setup.outputs.date }}
          prerelease: true
